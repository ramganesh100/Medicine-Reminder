<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>Medicine Status Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #000000; color: #172033;
      display: flex; justify-content: center; align-items: flex-start;
    }
    main {
      width: 100%; max-width: 520px; background: #fff;
      border-radius: 22px; padding: 26px 20px;
      box-shadow: 0 10px 35px rgba(25,45,75,.09);
    }
    h1 { margin: 0; text-align: center; font-size: 27px; }
    .sub { text-align: center; color: #667085; margin: 8px 0 20px; }
    .date { text-align: center; font-size: 14px; color: #667085; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .slot {
      min-height: 76px; border: 2px solid #d8e0eb; border-radius: 15px;
      background: #edf2f8; color: #243247; font-size: 20px;
      font-weight: 700; cursor: pointer; transition: .15s ease;
    }
    .slot small { display: block; font-size: 12px; font-weight: 500; margin-top: 4px; }
    .slot.taken { background: #20a464; color: #fff; border-color: #16834f; }
    .slot:focus-visible, .reset:focus-visible { outline: 3px solid #477fe8; outline-offset: 3px; }
    .hint { text-align: center; color: #667085; font-size: 13px; margin: 20px 0 0; }
    .reset {
      display: block; margin: 18px auto 0; padding: 10px 16px;
      border: 1px solid #cbd5e1; border-radius: 10px;
      background: #fff; color: #475467; font-size: 14px; cursor: pointer;
    }
    .reset:hover { background: #f8fafc; }
    @media (max-width: 360px) {
      main { padding: 22px 14px; }
      .slot { font-size: 18px; }
    }
  </style>
</head>
<body>
<main>
  <h1>💊 Ganesh Ram Medicine Status Tracker</h1>
  <p class="sub">Tap a time after taking your medicine</p>
  <div class="date" id="today"></div>

  <section class="grid" aria-label="Medicine time slots">
    <button class="slot" data-time="7 AM" type="button">7:00 AM<small>Not taken</small></button>
    <button class="slot" data-time="8 AM" type="button">8:00 AM<small>Not taken</small></button>
    <button class="slot" data-time="9 AM" type="button">9:00 AM<small>Not taken</small></button>
    <button class="slot" data-time="12 PM" type="button">12:00 PM<small>Not taken</small></button>
    <button class="slot" data-time="3 PM" type="button">3:00 PM<small>Not taken</small></button>
    <button class="slot" data-time="5 PM" type="button">5:00 PM<small>Not taken</small></button>
    <button class="slot" data-time="6 PM" type="button">6:00 PM<small>Not taken</small></button>
    <button class="slot" data-time="8 PM" type="button">8:00 PM<small>Not taken</small></button>
    <button class="slot" data-time="9 PM" type="button">9:00 PM<small>Not taken</small></button>
    <button class="slot" data-time="10 PM" id="lastSlot" type="button">10:00 PM<small>Not taken</small></button>
  </section>

  <p class="hint" id="status" aria-live="polite">Grey = pending • Green = taken</p>
  <button class="reset" id="manualReset" type="button">Reset all (if needed)</button>
</main>

<script>
(() => {
  const buttons = [...document.querySelectorAll(".slot")];
  const todayEl = document.getElementById("today");
  const status = document.getElementById("status");
  const storageKey = "medicineTrackerState";

  function todayKey(date = new Date()) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function showDate() {
    todayEl.textContent = new Date().toLocaleDateString(undefined, {
      weekday: "long", year: "numeric", month: "long", day: "numeric"
    });
  }

  function loadTaken() {
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
      if (saved.date !== todayKey()) {
        localStorage.setItem(storageKey, JSON.stringify({ date: todayKey(), taken: [] }));
        return [];
      }
      return Array.isArray(saved.taken) ? saved.taken : [];
    } catch {
      return [];
    }
  }

  let taken = loadTaken();

  function saveTaken() {
    localStorage.setItem(storageKey, JSON.stringify({ date: todayKey(), taken }));
  }

  function paint() {
    buttons.forEach(button => {
      const done = taken.includes(button.dataset.time);
      button.classList.toggle("taken", done);
      button.querySelector("small").textContent = done ? "✓ Taken" : "Not taken";
      button.setAttribute("aria-pressed", String(done));
    });
  }

  buttons.forEach(button => {
    button.addEventListener("click", () => {
      if (button.id === "lastSlot") {
        taken = [];
        saveTaken();
        paint();
        status.textContent = "10 PM completed. All time slots have been reset.";
        return;
      }

      const time = button.dataset.time;
      taken = taken.includes(time)
        ? taken.filter(item => item !== time)
        : [...taken, time];

      saveTaken();
      paint();
      status.textContent = taken.includes(time)
        ? `${time} marked as taken.`
        : `${time} marked as pending.`;
    });
  });

  document.getElementById("manualReset").addEventListener("click", () => {
    taken = [];
    saveTaken();
    paint();
    status.textContent = "All time slots reset.";
  });

  function checkNewDay() {
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
      if (saved.date !== todayKey()) {
        taken = [];
        saveTaken();
        paint();
        showDate();
        status.textContent = "A new day has started. All time slots are reset.";
      }
    } catch {
      taken = [];
      saveTaken();
      paint();
    }
  }

  showDate();
  paint();
  setInterval(checkNewDay, 30000);
})();
</script>
</body>
</html>
